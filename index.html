<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="لعبة بلوت في المتصفح">
<title>بلوت</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style id="boot">html{visibility:hidden}</style>
</head>
<body>
<div id="wrap">
<aside id="side">
<div class="tb"><button class="gb onlb" onclick="roomToggle()"><i>👥</i><span id="rcnt">الغرفة</span></button><button class="gb onlb" onclick="chatToggle()"><i>💬</i><span id="cbd">دردشة</span></button></div>
<div class="pan row" id="rn"></div>
<div class="pan st"><div class="h"><span>لنا</span><span>لهم</span></div><div class="v"><b id="s0">0</b><b id="s1">0</b></div><div id="streak"></div><div class="live" id="live"></div></div>
<div class="pan" id="info"></div>
<div class="pan hs"><div class="chh">النتائج السابقة</div><div class="hsc" id="hsc"><table><thead><tr><th>#</th><th>اللعب</th><th class="a">لنا</th><th class="b">لهم</th></tr></thead><tbody id="hist"></tbody></table></div></div>
<div id="chat"><div class="chd"><b>الدردشة</b><button onclick="chatToggle()">✕</button></div><div id="cl"></div><div class="cin"><input id="ct" maxlength="200" placeholder="اكتب رسالة" onkeydown="if(event.key=='Enter')chatSend()"><button onclick="chatSend()">إرسال</button></div></div>
</aside>
<main id="stage"><div id="tbl">
<div class="seat" id="p2"></div><div class="seat" id="p3"></div><div class="seat" id="p1"></div>
<div id="trp"></div><div id="rdn"></div><div id="dblb"></div><div id="rug"></div><div class="pjf" id="pjf0"></div><div id="mid"></div><div id="wait"><span id="wt"></span></div><div id="msg"></div></div><div id="hand"></div>
<div id="bar"><div class="me"><span class="dlr" id="dl0"><i></i><span>موزع</span></span><span class="avw"><button id="kawb" onclick="ENG.kawsh(ME)">كوشة</button><div class="av"></div><span class="nm">أنت</span></span><span class="by" id="by0"></span><span id="pl0"></span><button id="emb" onclick="emoTray()">😀</button></div><div id="act"></div></div>
<div id="emt"></div><div id="pmenu"></div></main>
</div>
<div id="ov" onclick="ovClick(event)"><div id="ovb"></div></div>
<div id="qv"><div id="qvb"></div></div>
<div id="rp"><div id="rpb"></div></div>
<div id="nbn"></div>
<div id="lobby"><div class="lbx"><h1>بلوت</h1>
 <label>اسمك</label><input id="lnm" maxlength="20" placeholder="اسمك في اللعب">
 <button class="go" onclick="lobbySolo()">لعب فردي ضد الحاسوب</button>
 <button onclick="lobbyCreate()">إنشاء غرفة جديدة</button>
 <div class="lrow"><input id="lcode" maxlength="5" placeholder="كود الغرفة" onkeydown="if(event.key=='Enter')lobbyJoin()"><button onclick="lobbyJoin()">دخول</button></div>
 <div id="lmsg"></div></div></div>
<noscript>يحتاج اللعب إلى تفعيل جافا سكريبت.</noscript>
<!-- محمّل الملفات: يجلب كل ملف بعد التحقق من الخادم (لا يستعمل نسخة قديمة محفوظة في المتصفح)، فيرى اللاعبون كل تحديث فور تحميل الصفحة دون حذف بيانات الموقع.
     إن تعذّر ذلك (مثلًا عند فتح الصفحة من الملفات مباشرة) رجع للتحميل العادي. الترتيب مهم: كل ملف يعتمد على ما قبله. -->
<script>
(function(){
 var CSS=['css/style.css'],JS=['js/engine.js','js/config.js','js/ui.js','js/game.js','js/net.js','js/main.js'];
 function show(){var b=document.getElementById('boot');if(b)b.remove()}
 setTimeout(show,5000);
 function plain(){
  CSS.forEach(function(f){var l=document.createElement('link');l.rel='stylesheet';l.href=f;document.head.appendChild(l)});
  (function nx(i){if(i>=JS.length){show();return}var s=document.createElement('script');s.src=JS[i];s.onload=function(){nx(i+1)};s.onerror=function(){nx(i+1)};document.body.appendChild(s)})(0)}
 function get(f){return fetch(f,{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error(f);return r.text()})}
 if(!window.fetch||location.protocol==='file:')return plain();
 Promise.all(CSS.concat(JS).map(get)).then(function(t){
  t.slice(0,CSS.length).forEach(function(x,i){var st=document.createElement('style');st.textContent=x+'\n/*# sourceURL='+CSS[i]+' */';document.head.appendChild(st)});
  t.slice(CSS.length).forEach(function(x,i){var s=document.createElement('script');s.text=x+'\n//# sourceURL='+JS[i];document.body.appendChild(s)});
  show()
 }).catch(plain)
})();
</script>
</body>
</html>
